<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kule Kumandası</title>
<style>
  body { margin:0; background:#222; color:white; font-family:Arial; text-align:center; height:100vh; display:flex; flex-direction:column; justify-content:center; }
  h1 { font-size:40px; }
  input { font-size:40px; padding:20px; width:200px; text-align:center; margin:20px; }
  button { font-size:60px; padding:40px; background:#FF5722; border:none; color:white; border-radius:30px; margin:20px; }
  button:disabled { background:#666; }
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<h1>Kule Oyunu</h1>
<p>Şifreyi Gir:</p>
<input id="pass" type="text" maxlength="4" placeholder="1234">
<button id="connect">Bağlan</button>

<button id="drop" disabled style="flex-grow:1; margin:40px;">
  KÜPÜ BIRAK!
</button>

<script>
const urlParams = new URLSearchParams(location.search);
const urlPass = urlParams.get('pass');
if(urlPass) document.getElementById('pass').value = urlPass;

const consoleUrl = 'https://turgutoaydin.github.io/turgutoaydin/';

document.getElementById('connect').onclick = () => {
  const entered = document.getElementById('pass').value;
  if(entered.length !== 4 || isNaN(entered)) return alert('4 haneli şifre gir!');
  
  // Şifre doğruysa (QR'dan geldiyse veya manuel doğru girdiyse) aktif et
  document.getElementById('connect').disabled = true;
  document.getElementById('pass').disabled = true;
  document.getElementById('drop').disabled = false;
  
  alert('Bağlandı! Butona basarak küpü düşür.');
  
  // Telegram vibration
  if(window.Telegram?.WebApp?.HapticFeedback) {
    Telegram.WebApp.HapticFeedback.impactOccurred('medium');
  }
};

document.getElementById('drop').onclick = () => {
  // Ana ekranı yeni sekmede aç + drop komutu gönder
  window.open(consoleUrl + '?drop=1', '_blank');
  
  if(window.Telegram?.WebApp?.HapticFeedback) {
    Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
  }
};
</script>
</body>
</html>
