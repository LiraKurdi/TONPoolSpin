<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Pool Spin DEX</title>

  <link rel="stylesheet" href="style.css" />
  <!-- Telegram Mini App (opsiyonel) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <div class="app">

    <!-- TOP TITLE PILL -->
    <header class="top">
      <div class="title-pill">
        <span>Pool Spin DEX</span>
      </div>
    </header>

    <!-- GAME GRID -->
    <main class="mid">
      <section class="grid-wrap">
        <div id="grid" class="grid" aria-label="slot grid"></div>
      </section>

      <!-- HUD + SPIN AREA -->
      <section class="hud">
        <div class="hud-left">
          <div class="hud-row">
            <div class="label">Level</div>
            <div class="value" id="levelValue">1</div>
          </div>

          <div class="hud-row balance">
            <div class="label">Balance</div>
            <div class="value" id="balanceValue">100.250,00 USDT</div>
          </div>

          <div class="lastspin-card">
            <div class="lastspin-title">Last Spin</div>
            <div class="lastspin-body" id="lastSpinBody">
              Ready.
            </div>
          </div>
        </div>

        <div class="hud-right">
          <button id="spinBtn" class="spin-btn" aria-label="spin">
            <span class="spin-icon">⟳</span>
          </button>
        </div>
      </section>

      <!-- CONTROLS ROW -->
      <section class="controls">
        <div class="auto">
          <div class="auto-label">Auto</div>
          <div class="auto-pills">
            <button class="pill-btn" data-auto="10">10</button>
            <button class="pill-btn" data-auto="20">20</button>
            <button class="pill-btn" data-auto="50">50</button>
          </div>

          <button id="autoToggle" class="toggle" aria-label="auto toggle">
            <span class="toggle-knob"></span>
            <span class="toggle-text" id="autoText">ON</span>
          </button>
        </div>

        <div class="fee">
          <button id="feeMinus" class="fee-btn" aria-label="fee minus">−</button>
          <div class="fee-mid">
            <div class="fee-value" id="feeValue">0.10</div>
            <div class="fee-label">Spin Fee</div>
          </div>
          <button id="feePlus" class="fee-btn" aria-label="fee plus">+</button>
        </div>
      </section>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" aria-label="bottom navigation">
      <button class="nav-item active">
        <div class="nav-ic">🎰</div>
        <div class="nav-tx">Game</div>
      </button>
      <button class="nav-item">
        <div class="nav-ic">☑️</div>
        <div class="nav-tx">Tasks</div>
      </button>
      <button class="nav-item">
        <div class="nav-ic">⌂</div>
        <div class="nav-tx">Home</div>
      </button>
      <button class="nav-item">
        <div class="nav-ic">👥</div>
        <div class="nav-tx">Referance</div>
      </button>
      <button class="nav-item">
        <div class="nav-ic">●</div>
        <div class="nav-tx">Profile</div>
      </button>
    </nav>

  </div>

  <script src="main.js"></script>
</body>
</html>
